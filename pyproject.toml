[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-video-creator"
version = "0.1.0"
description = "HTML to Video rendering pipeline using Playwright + FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

[tool.setuptools.packages.find]
include = ["web_video_creator*"]
