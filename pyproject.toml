[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-video-creator"
version = "0.2.0"
description = "Code-as-Video Rendering & Three-Tier AI Video Post-Production Engine using Playwright + FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "liusc007"}
]
keywords = [
    "video-generation",
    "html-to-video",
    "ai-video",
    "post-production",
    "playwright",
    "ffmpeg",
    "hud-overlay",
    "subtitles",
    "spatial-audio"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "playwright>=1.40.0",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/liusc007/web-video-creator"
Repository = "https://github.com/liusc007/web-video-creator"
Issues = "https://github.com/liusc007/web-video-creator/issues"

[project.scripts]
web-video-creator = "web_video_creator.cli:main"
wvc = "web_video_creator.cli:main"

[tool.setuptools.packages.find]
include = ["web_video_creator*"]
